<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda · Drawikky</title>
<meta name="description" content="Agenda de encomendas da Drawikky: quando abre, quantas vagas e como anda a fila.">
<meta property="og:title" content="Drawikky · ilustradora e capista">
<meta property="og:description" content="Curte meus desenhos? Tenha um só seu! Portfólio, agenda e encomendas.">
<meta property="og:image" content="assets/cenas/abertura.webp">
<meta name="theme-color" content="#FA9A2D">
<link rel="icon" href="assets/avatar.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
<script src="js/dados.js"></script>
<script src="js/loja.js"></script>
<script src="js/tema.js"></script>
<script src="js/icones.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/agenda.js" defer></script>
<script src="js/site.js" defer></script>
</head>
<body data-pagina="agenda">
<main id="conteudo">

  <!-- ===== cartão de título do episódio ===== -->
  <section class="cab" id="cabecalho">
    <div class="cab-fundo fundo-padrao" aria-hidden="true"></div>
    <div class="cab-in wrap">
      <div class="cab-txt">
        <p class="t-selo cab-ep" id="cab-ep"></p>
        <h1 class="t-letreiro cab-titulo" id="cab-titulo"></h1>
        <p class="cab-sub"><span id="cab-sub"></span> <em class="t-en" id="cab-en"></em></p>
      </div>
      <figure class="cab-tela"><img id="cab-img" src="" width="1080" height="1080" alt="" fetchpriority="high"></figure>
    </div>
    <div class="arco arco-fino" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </section>

  <section class="secao ag-status-sec" aria-label="Situação das encomendas">
    <div class="wrap"><div class="st" id="agenda-status"></div></div>
  </section>

  <section class="secao" aria-labelledby="ses-t">
    <div class="wrap">
      <header class="sec-cab surge">
        <p class="t-selo sec-ep">Grade</p>
        <h2 class="t-letreiro sec-titulo" id="ses-t">Agendas por mês</h2>
        <p class="sec-sub">Cada agenda abre numa data e tem um número de vagas. <em class="t-en">· monthly slots</em></p>
      </header>
      <ul class="ses-lista" id="agenda-sessoes"></ul>
    </div>
  </section>

  <section class="secao ag-cal-sec" aria-labelledby="cal-t">
    <div class="wrap ag-duas">
      <div class="ag-bloco surge">
        <h2 class="t-letreiro sec-titulo sec-titulo-p" id="cal-t">Calendário</h2>
        <div class="cal" id="agenda-cal"></div>
      </div>
      <div class="ag-bloco surge">
        <h2 class="t-letreiro sec-titulo sec-titulo-p">Próximas datas</h2>
        <ul class="ev-lista" id="agenda-eventos"></ul>
      </div>
    </div>
  </section>

  <section class="secao" aria-labelledby="fila-t">
    <div class="wrap">
      <header class="sec-cab surge">
        <p class="t-selo sec-ep">Bastidores</p>
        <h2 class="t-letreiro sec-titulo" id="fila-t">Fila de produção</h2>
        <p class="sec-sub">Em que etapa está cada encomenda. <em class="t-en">· work in progress</em></p>
      </header>
      <ol class="fila-lista" id="agenda-fila"></ol>
    </div>
  </section>

</main>
</body>
</html>
